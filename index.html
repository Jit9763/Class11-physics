<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Portal</title>

  <link rel="stylesheet" href="style.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script src="sim.js"></script>
</head>
<body>
    <div id="header" style="background: #333; color: white; padding: 20px; text-align: center;">
        <h1>Physics Class 11 - Learning Portal "Motion"</h1></div>
  <div id="topics-container" style="padding: 30px;"></div>

  <script>
  const container = document.getElementById("topics-container");

  fetch('data.json')
    .then(response => response.json())
    .then(data => {
      data.forEach(topic => {
        let notesHTML = "";
        topic.notes.forEach(note => {
          notesHTML += `<p>• ${note}</p>`;
        });

        const cardHTML = `
          <div class="topic-card" id="${topic.id}" data-sim-id="${topic.simId}">
            <h2 class="title">${topic.title}</h2>
            <div class="notes-area">${notesHTML}</div>
            <button class="sim-btn" onclick="activateSim('${topic.id}')">Launch Simulator</button>
            <div class="sim-placeholder"></div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    })
    .catch(error => {
      console.error('Error loading data:', error);
      container.innerHTML = '<p>⚠️ Error loading lesson data.</p>';
    });
  </script>
  <div id="footer" style="padding: 20px; text-align: center; background: #333; color: white;">© 2025 Physics Class 11 Learning Portal</div>
</body>
</html>
